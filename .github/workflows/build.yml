name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK r26b
        run: |
          curl -sSLO https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q android-ndk-r26b-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26b" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.arch }}
        run: |
          "$ANDROID_NDK_HOME/ndk-build" NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            APP_APPLICATION_MK=jni/Application.mk \
            APP_ABI=${{ matrix.arch }}

      - name: Verify artifact
        run: |
          test -f libs/${{ matrix.arch }}/libLawnZoomTab.so
          file libs/${{ matrix.arch }}/libLawnZoomTab.so

      - uses: actions/upload-artifact@v4
        with:
          name: libLawnZoomTab-${{ matrix.arch }}
          path: libs/${{ matrix.arch }}/libLawnZoomTab.so
